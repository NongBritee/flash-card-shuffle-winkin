<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fd3ff">
<title>Weather Cards การ์ดสภาพอากาศ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preload" href="cards/back.webp" as="image">
<link rel="stylesheet" href="fonts/fonts.css?v=4">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<main id="app">
  <header id="top">
    <h1><span class="en">Weather Cards</span> <span class="th">การ์ดสภาพอากาศ</span></h1>
    <div id="score" aria-live="polite"></div>
    <div class="tools">
      <button id="lucky" class="round" aria-label="สุ่มให้"><span>🎲</span><small>สุ่มให้</small></button>
      <button id="shuffle" class="round" aria-label="สับการ์ด"><span>🔀</span><small>สับการ์ด</small></button>
    </div>
  </header>

  <p id="hint">👆 จิ้มเลือกการ์ด 1 ใบ</p>
  <section id="table" aria-label="การ์ด 5 ใบ"></section>

  <!-- detail view -->
  <div id="detail" hidden>
    <div class="panel">
      <div class="cardBig">
        <img id="bigImg" alt="">
        <button id="cover" aria-label="แตะเพื่อแปล">🇹🇭 แตะเพื่อแปล</button>
        <div id="bubble" hidden></div>
      </div>
      <div class="side">
        <div id="letters" aria-label="ตัวอักษร"></div>
        <div id="thaiWord" hidden></div>
        <div class="actions">
          <button id="btnSpell" class="act spell"><span>🔤</span><b>สะกด</b><small>Spell</small></button>
          <button id="btnSay" class="act say"><span>🔊</span><b>ฟัง</b><small>Listen</small></button>
          <button id="btnThai" class="act thai"><span>🇹🇭</span><b>แปล</b><small>Thai</small></button>
        </div>
        <button id="btnClose" class="act done"><span>✅</span><b>เลือกใบต่อไป</b></button>
      </div>
    </div>
  </div>

  <!-- round complete -->
  <div id="win" hidden>
    <div class="winBox">
      <div class="big">🎉</div>
      <h2>เก่งมาก!<br><span>Great job!</span></h2>
      <div id="winCards"></div>
      <button id="again" class="act done"><span>🔁</span><b>เล่นอีกครั้ง</b></button>
    </div>
  </div>
  <div id="notice" hidden>🔇 เครื่องนี้ยังไม่มีเสียงภาษาไทย<br><small>บน PC ให้เปิดด้วย <b>Microsoft Edge</b> หรือเพิ่มเสียงภาษาไทยใน Windows<br>(Settings → Time &amp; language → Speech → Add voices → ไทย)</small></div>
  <canvas id="fx"></canvas>
</main>
<script src="js/words.js?v=4"></script>
<script src="js/speech.js?v=4"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
